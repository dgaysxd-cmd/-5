<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки товаров</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="products">
        
        <!-- Карточка 1 -->
        <article class="product-card">
            <img src="img/image 1.png" alt="Смартфон Nova X" class="product-card__image">
            <div class="product-card__content">
                <h2 class="product-card__title">Nova X</h2>
                <p class="product-card__description">OLED-дисплей и двойная камера.</p>
            </div>
            <div class="product-card__footer">
                <span class="product-card__price">49 990 ₽</span>
                <button class="product-card__btn">Купить</button>
            </div>
        </article>

        <!-- Карточка 2 -->
        <article class="product-card">
            <img src="img/image 1 (1).png" alt="Наушники Sonic Pro" class="product-card__image">
            <div class="product-card__content">
                <h2 class="product-card__title">Sonic Pro</h2>
                <p class="product-card__description">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой быстрой зарядки и автономностью до 40 часов.</p>
            </div>
            <div class="product-card__footer">
                <span class="product-card__price">12 490 ₽</span>
                <button class="product-card__btn">Купить</button>
            </div>
        </article>

        <!-- Карточка 3 -->
        <article class="product-card">
            <img src="img/image 1 (2).png" alt="Умные часы Pulse Watch" class="product-card__image">
            <div class="product-card__content">
                <h2 class="product-card__title">Pulse Watch</h2>
                <p class="product-card__description">Умные часы для спорта и отслеживания активности.</p>
            </div>
            <div class="product-card__footer">
                <span class="product-card__price">18 990 ₽</span>
                <button class="product-card__btn">Купить</button>
            </div>
        </article>

    </div>

</body>
</html>
